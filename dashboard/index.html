<style>

}

    --bg:#12151a; --card:#1a1f26; --line:#2b323b; --ink:#e8ebef; --mo:#9aa4b0;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);

section{display:none} section.on{display:block}

.chu-thich{font-size:12.5px;color:var(--mo);margin-top:10px;font-style:italic}

.the-cd dt{color:var(--mo);font-weight:600}
.the-cd dd{margin:0}
.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--xanh)}
.pb{display:flex;gap:8px;flex-wrap:wrap}
.pb>span{font-size:13px;padding:5px 11px;border-radius:8px;font-weight:600}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:92%;

<script>
"use strict";

/* ── Ba quy tac hien thi (pd-D §5) ──────────────────────────────────
   ① Nhom duoi 10 HT -> AN TY LE, chi hien so dem. Trang tu lam.
   ② Bang chia theo V-xx / rao can / S / CD -> PHAI co cot HOT*.
      Thieu -> hien canh bao do ngay tren bang.
   ③ O khong co du lieu -> chip "⏸ cho du kien".
      ⛔ KHONG hien 0 (0 va "chua do" trong giong nhau tren bieu do). */

var NGUONG_NHOM = 10;

function e(t, a, c){
  var n = document.createElement(t), k;
  if (a) for (k in a){
    if (k === "class") n.className = a[k];
    else if (k === "html") n.innerHTML = a[k];
    else n.setAttribute(k, a[k]);
  }
  if (c != null) n.textContent = c;
  return n;
}
function txt(v){ return (v == null || v === "") ? null : String(v); }

/* ③ — o thieu du lieu */
function o(v, ten){
  if (v == null || v === "" ) {
    var s = e("span", {class:"chip cho"}, "⏸ chờ dữ kiện" + (ten ? " · " + ten : ""));
    return s;
  }
  return document.createTextNode(String(v));
}

function bang(cols, rows, opt){
  opt = opt || {};
  var t = e("table"), th = e("tr"), i;
  for (i = 0; i < cols.length; i++)
    th.appendChild(e("th", {class: cols[i].num ? "num" : ""}, cols[i].t));
  t.appendChild(e("thead")).appendChild(th);
  var tb = e("tbody");
  for (i = 0; i < rows.length; i++){
    var tr = e("tr"), j;
    for (j = 0; j < cols.length; j++){
      var td = e("td", {class: cols[j].num ? "num" : ""});
      var v = cols[j].f(rows[i]);
      if (v instanceof Node) td.appendChild(v);
      else if (v == null) td.appendChild(o(null));
      else td.textContent = String(v);
      tr.appendChild(td);
    }
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  if (!rows.length) return e("p", {class:"trong"}, opt.trong || "⛔ Không có dòng nào trong kỳ.");
  return t;
}

function the(card, ds){
  var g = e("div", {class:"the"});
  (ds || []).forEach(function(x){
    var d = e("div", {class: x.canh_bao ? "canh" : ""});
    d.appendChild(e("div", {class:"n"}, x.nhan));
    var v = e("div", {class:"v"});
    v.appendChild(o(x.so));
    d.appendChild(v);
    if (txt(x.phu)) d.appendChild(e("div", {class:"p"}, x.phu));
    g.appendChild(d);
  });
  card.appendChild(g);
}

function khoi(tieu_de, noi_dung, chu_thich, chan){
  var c = e("div", {class:"card"});
  if (tieu_de) c.appendChild(e("h2", null, tieu_de));
  (Array.isArray(noi_dung) ? noi_dung : [noi_dung]).forEach(function(n){
    if (n) c.appendChild(n);
  });
  if (chu_thich) c.appendChild(e("p", {class:"chu-thich"}, chu_thich));
  if (chan) c.appendChild(e("div", {class:"chan-bang"}, chan));
  return c;
}

/* ① + ② — bang truc, luon co cot HOT* */
function bang_truc(ds, nhan_ma){
  var canh = null;
  if (ds && ds.length && ds[0].hot_sao === undefined)
    canh = e("div", {class:"canh-bao"},
      "⛔ Bảng này chia nhóm theo một thuộc tính vốn là tín hiệu chấm điểm nhưng "
      + "THIẾU cột HOT* → kết luận so sánh giữa các nhóm là kết luận giả (pd-I2 §4).");
  var t = bang([
    {t: nhan_ma || "Mã", f: function(r){
        var s = e("span");
        s.appendChild(document.createTextNode(r.ma));
        if (txt(r.ten)) s.appendChild(e("span", {class:"ky"}, " · " + r.ten));
        if (!r.du_mau) s.appendChild(e("span", {class:"chip cho"}, " ⚠ chưa đủ mẫu"));
        return s;
      }},
    {t:"HT", num:1, f: function(r){ return r.n; }},
    {t:"HOT", num:1, f: function(r){ return r.hot; }},
    {t:"HOT*", num:1, f: function(r){ return r.hot_sao; }},
    {t:"% có SĐT", num:1, f: function(r){ return r.co_sdt; }}
  ], ds || []);
  return canh ? [canh, t] : [t];
}

/* ══ BO CUC `insight` — 6 tab ══════════════════════════════════════ */
var BC_INSIGHT = [
{ten:"Tổng quan", ve: function(d, h){
  the(h, d.the_so);
  var r = d.tu_kiem_4_rui_ro || {};
  h.appendChild(khoi("Bốn rủi ro đọc số — tự kiểm", bang([
    {t:"Rủi ro", f:function(x){ return x[0]; }},
    {t:"Kết quả kiểm kỳ này", f:function(x){ return x[1]; }}
  ], [["Mẫu bị lọc", r.mau_bi_loc], ["Mẫu nhỏ", r.mau_nho],
      ["Lặp vòng", r.lap_vong], ["Lạm phát HOT", r.lam_phat_hot]])));
  if (d.l6_7_ngo_vat_lieu)
    h.appendChild(khoi("L6.7 · Ngờ vật liệu — mã riêng của ngành nha",
      e("p", null, d.l6_7_ngo_vat_lieu.doc_ra),
      "⛔ Không gộp L6.7 vào L6.2: khách không tự kiểm được vật liệu trong miệng mình."));
  if ((d.nhom_n_vang_mat || []).length)
    h.appendChild(khoi("Nhóm khách vắng mặt trong kỳ",
      e("ul", {html: d.nhom_n_vang_mat.map(function(x){ return "<li>" + x + "</li>"; }).join("")}),
      "★ Nhóm vắng mặt là một PHÁT HIỆN, không phải ô trống — nghĩa là kỳ này không có nội dung nào nhắm nhóm đó."));
}},
{ten:"Ba trục", ve: function(d, h){
  var t = d.truc || {};
  h.appendChild(khoi("Vấn đề răng · V-01…V-11", bang_truc(t.v_rang, "Vấn đề răng")));
  h.appendChild(khoi("Nhóm giá trị · V1 / V2 / V3", bang_truc(t.nhom_gt, "Nhóm"),
    "★ Một lead HOT·V3 (cạo vôi) không bằng một lead WARM·V1 (All-On) về giá trị kỳ vọng. Gộp lại thì V3 che mất việc V1 đang rò."));
  h.appendChild(khoi("Giai đoạn · S1 / S2 / S3 / CS", bang_truc(t.giai_doan, "Giai đoạn"),
    "★ S3 là điểm quyết định của ngành nha — phần lớn lead rơi ở đây, không rơi ở S1."));
  h.appendChild(khoi("Trạng thái vận hành · L-code", bang_truc(t.l_code, "L-code")));
  h.appendChild(khoi("Nhóm khách · N1…N6", bang_truc(t.nhom_khach, "Nhóm")));
  h.appendChild(khoi("Rào cản chốt", bang([
      {t:"Rào cản", f:function(r){ return r.ma; }},
      {t:"Lượt", num:1, f:function(r){ return r.luot; }},
      {t:"% lượt", num:1, f:function(r){ return r.pc_luot; }}
    ], t.rao_can || []), d.cach_dem_rao_can));
}},
{ten:"Chân dung", ve: function(d, h){
  if (d.cho_cong_0){
    h.appendChild(e("div", {class:"luu-y"}, "⏸ " + (d.ghi_chu_cong_0 || "Chưa qua CỔNG 0.")));
    var nl = d.nguyen_lieu_chan_dung || {};
    h.appendChild(khoi("Nguyên liệu phác họa ① — cụm chữ khách tự nói", bang([
      {t:"Cụm", f:function(r){ return r.cum; }},
      {t:"Lượt", num:1, f:function(r){ return r.luot; }}
    ], nl.cum_chu_khach_tu_noi || [])));
    var ch = nl.cau_hoi_dau || {};
    h.appendChild(khoi("Nguyên liệu ② — câu hỏi đầu tiên của khách", bang([
      {t:"Loại", f:function(r){ return r[0]; }},
      {t:"HT", num:1, f:function(r){ return r[1]; }}
    ], [["Hỏi giá ngay ở tin đầu", ch.hoi_gia_ngay], ["Nêu tình trạng", ch.neu_tinh_trang]])));
    h.appendChild(khoi("Nguyên liệu ④ — dấu hiệu người thứ ba",
      e("p", null, (nl.dau_hieu_nguoi_thu_ba != null ? nl.dau_hieu_nguoi_thu_ba : "—")
        + " hội thoại có dấu hiệu người nhà (bố/mẹ/con/vợ/chồng/cả nhà)."),
      "★ Người quyết định thường không phải người nhắn. Nhóm này hay bị chấm COLD oan mà lại là tệp LTV cao nhất."));
    return;
  }
  (d.chan_dung || []).forEach(function(c){
    var w = e("div", {class:"the-cd"});
    w.appendChild(e("h3", null, c.cd + " · " + c.ten));
    w.appendChild(e("div", {class:"meta"}, c.n + " HT · " + (c.pc_mau || "—")
      + " mẫu · " + (c.gt || "—") + " · HOT " + (c.hot || "—")
      + " · HOT* " + (c.hot_sao || "—") + " · có SĐT " + (c.co_sdt || "—")));
    var dl = e("dl");
    [["Họ là ai", c.ho_la_ai], ["Insight", c.insight],
     ["Câu hỏi ngầm", (c.cau_hoi_ngam || []).join(" · ")],
     ["Rào chủ đạo", c.rao_chu_dao], ["Bằng chứng gỡ", (c.bang_chung_go || []).join(" · ")],
     ["Rơi ở đâu", c.roi_o_dau], ["Làm bằng", (c.lam_bang || []).join(" · ")]
    ].forEach(function(p){
      dl.appendChild(e("dt", null, p[0]));
      var dd = e("dd"); dd.appendChild(o(p[1])); dl.appendChild(dd);
    });
    w.appendChild(dl);
    h.appendChild(w);
  });
  if (d.cd0) h.appendChild(khoi("CD0 · hội thoại không vào chân dung nào",
    e("p", null, d.cd0.n + " HT · " + (d.cd0.pc_mau || "—") + " mẫu"),
    "CD0 vượt 25% mẫu → bản phác họa CHƯA ĐỦ, phác lại. ⛔ Không nhét bừa vào chân dung gần nhất."));
}},
{ten:"Quảng cáo", ve: function(d, h){
  var a = d.ads || {};
  if (!a.co_so_lieu)
    h.appendChild(e("div", {class:"luu-y"}, "⏸ Kỳ này chưa có file số ads. "

  h.appendChild(khoi("★ Post hứa gì ↔ khách hỏi gì ngay sau đó", bang([
    {t:"Post", f:function(r){
        var s = e("span");
        s.appendChild(document.createTextNode(r.ma));
        if (!r.du_mau) s.appendChild(e("span", {class:"chip cho"}, " ⚠ chưa đủ mẫu"));
        return s;
      }},
    {t:"Lời hứa của post", f:function(r){ return r.loi_hua; }},
    {t:"HT", num:1, f:function(r){ return r.n_ht; }},
    {t:"Hỏi giá ở tin đầu", num:1, f:function(r){ return r.hoi_gia_dau; }},
    {t:"Có SĐT", num:1, f:function(r){ return r.co_sdt; }},
    {t:"Khuôn hình", f:function(r){
        var m = {"khop":["luc","khớp"],
                 "hua-nhanh-khach-hoi-gia":["do","hứa nhanh → khách hỏi giá"],
                 "neu-hang-khach-van-ngo":["cho","nêu hãng → khách vẫn ngờ"]};
        var k = m[r.khuon] || ["xanh", r.khuon];
        return e("span", {class:"chip " + k[0]}, k[1]);
      }}
  ], a.post || []), "★ Khuôn \"nêu hãng → khách vẫn ngờ\" là phát hiện quý nhất của ngành nha: rào L6.7 ⛔ không gỡ được bằng cách nói tên hãng to hơn, mà bằng cách cho khách THỨ TỰ KIỂM ĐƯỢC (mã trụ · phiếu bảo hành · được xem trước khi cấy)."));
  var p = a.phe_u || {};
  h.appendChild(khoi("Phễu nha khoa", bang([
      {t:"Chặng", f:function(r){ return r[0]; }},
      {t:"Số", num:1, f:function(r){ return r[1]; }}
    ], [["Inbox", p.inbox], ["Có SĐT", p.co_sdt], ["Kết nối (gọi được)", p.ket_noi],
        ["Đặt lịch khám", p.dat_lich], ["★ ĐẾN KHÁM (show-up)", p.den_kham]]),
    a.canh_bao_phe_u));
  if ((d.doi_thu_bi_so_sanh || []).length)
    h.appendChild(khoi("Đối thủ bị so sánh trong kỳ (L6.2)", bang([
      {t:"Đơn vị", f:function(r){ return r[0]; }},
      {t:"Lượt", num:1, f:function(r){ return r[1]; }}
    ], d.doi_thu_bi_so_sanh), "⛔ Chỉ dùng nội bộ để ĐẾM. ⛔ Không nêu tên đối thủ để hạ thấp trong bất kỳ nội dung gửi khách."));
}},
{ten:"Việc & hook", ve: function(d, h){
  if (!(d.ma_tran || []).length)
    h.appendChild(e("div", {class:"luu-y"}, "⏸ Chưa qua CỔNG 1 — ma trận ưu tiên chưa được duyệt nên ⛔ chưa sinh hook."));

var BO_CUC = {insight: BC_INSIGHT, qc: BC_QC};

function ve(d){
  var bc = BO_CUC[d.bo_cuc] || BC_INSIGHT;
  var la_qc = d.bo_cuc === "qc";
  document.getElementById("tieu-de").textContent =
    (la_qc ? "QC Trực page · " : "Insight khách hàng · ") + (d.thuong_hieu || "Nha khoa Paris");
  document.title = (la_qc ? "QC Trực page" : "Insight khách hàng") + " · Nha khoa Paris";
  document.getElementById("ky").textContent = "Kỳ " + (d.ky || "—");
  var nl = document.getElementById("nhan-luong");
  nl.textContent = la_qc ? "LUỒNG Q · chỉ trưởng nhóm" : "LUỒNG I · Marketing";
  nl.className = "luong " + (la_qc ? "q" : "i");

  var nav = document.getElementById("nav"), than = document.getElementById("than");
  nav.innerHTML = ""; than.innerHTML = "";
  bc.forEach(function(tab, i){
    var b = e("button", {role:"tab", "aria-selected": i === 0 ? "true" : "false"}, tab.ten);
    var s = e("section", {class: i === 0 ? "on" : ""});
    try { tab.ve(d, s); }
    catch (err) {
      s.appendChild(e("div", {class:"canh-bao"}, "⛔ Lỗi dựng tab: " + err.message));
    }
    b.onclick = function(){
      nav.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-selected", "false"); });
      than.querySelectorAll("section").forEach(function(x){ x.className = ""; });
      b.setAttribute("aria-selected", "true");
      s.className = "on";
    };
    nav.appendChild(b); than.appendChild(s);
  });
}

function loi(msg){
  document.getElementById("than").appendChild(e("div", {class:"canh-bao"}, msg));
}

(function(){
  /* Khoi nhung doc TRUOC data/index.json -> ban mot file khong can may chu tinh */
  var raw = (document.getElementById("pd-data") || {}).textContent || "null";
  var nhung = null;
  try { nhung = JSON.parse(raw); } catch (x) { nhung = null; }
  if (nhung) { ve(nhung); return; }

  fetch("data/index.json").then(function(r){ return r.json(); }).then(function(ds){
    var sel = document.getElementById("chon-ky");
    sel.hidden = false;
    ds.forEach(function(x, i){
      sel.appendChild(e("option", {value: x.file}, (x.bo_cuc === "qc" ? "QC · " : "Insight · ") + x.ky));
      if (i === 0) sel.value = x.file;
    });
    function tai(f){
      fetch("data/" + f).then(function(r){ return r.json(); }).then(ve)
        .catch(function(){ loi("⛔ Không đọc được data/" + f); });
    }
    sel.onchange = function(){ tai(sel.value); };
    if (ds.length) tai(ds[0].file);
    else loi("⛔ data/index.json rỗng.");
  }).catch(function(){
    loi("⛔ Chưa có data/index.json, và trang cũng không có khối JSON nhúng. "
      + "Mở bằng máy chủ tĩnh: cd dashboard && python -m http.server 8080 — "
      + "hoặc nhúng file kỳ vào <script id=\"pd-data\"> rồi mở trực tiếp.");
  });
})();
